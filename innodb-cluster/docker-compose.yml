# Laboratorio didattico locale: MySQL 8.0.32, non per produzione.
# Il tag 8.0.32 mantiene compatibilita' con il vecchio dbwebapp e Router.
x-mysql-health: &mysql-health
  test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -P 3306 --silent"]
  interval: 5s
  timeout: 3s
  retries: 30
  start_period: 45s

x-mysql-common: &mysql-common
  image: mysql:8.0.32
  env_file: mysql-server.env
  healthcheck: *mysql-health
  restart: unless-stopped
  stop_grace_period: 60s

services:
  mysql-server-1:
    <<: *mysql-common
    hostname: mysql-server-1
    command:
      - --server-id=1
      - --report-host=mysql-server-1
      - --relay-log=mysql-server-1-relay-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-bin=mysql-bin
      - --log-replica-updates=ON
      - --binlog-checksum=NONE
      - --transaction-write-set-extraction=XXHASH64
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "127.0.0.1:3301:3306"
    volumes:
      - mysql1_data:/var/lib/mysql

  mysql-server-2:
    <<: *mysql-common
    hostname: mysql-server-2
    command:
      - --server-id=2
      - --report-host=mysql-server-2
      - --relay-log=mysql-server-2-relay-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-bin=mysql-bin
      - --log-replica-updates=ON
      - --binlog-checksum=NONE
      - --transaction-write-set-extraction=XXHASH64
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "127.0.0.1:3302:3306"
    volumes:
      - mysql2_data:/var/lib/mysql

  mysql-server-3:
    <<: *mysql-common
    hostname: mysql-server-3
    command:
      - --server-id=3
      - --report-host=mysql-server-3
      - --relay-log=mysql-server-3-relay-bin
      - --gtid-mode=ON
      - --enforce-gtid-consistency=ON
      - --log-bin=mysql-bin
      - --log-replica-updates=ON
      - --binlog-checksum=NONE
      - --transaction-write-set-extraction=XXHASH64
      - --default-authentication-plugin=mysql_native_password
    ports:
      - "127.0.0.1:3303:3306"
    volumes:
      - mysql3_data:/var/lib/mysql

  mysql-shell:
    # La vecchia neumayer/mysql-shell-batch usa MySQL Shell 1.0.11
    # e maschera gli errori con '|| true'. Questa usa mysqlsh 8.0.32.
    image: mysql:8.0.32
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - >-
        mysqlsh --js --file /scripts/setupCluster.js
        && MYSQL_PWD="$$MYSQL_PASSWORD" mysql --host=mysql-server-1 --user=root < /scripts/db.sql
    env_file: mysql-shell.env
    volumes:
      - ./scripts:/scripts:ro
    depends_on:
      mysql-server-1:
        condition: service_healthy
      mysql-server-2:
        condition: service_healthy
      mysql-server-3:
        condition: service_healthy
    restart: "no"

  mysql-router:
    image: mysql/mysql-router:8.0.32
    env_file: mysql-router.env
    ports:
      - "127.0.0.1:6446:6446"
      - "127.0.0.1:6447:6447"
    depends_on:
      mysql-shell:
        condition: service_completed_successfully
    restart: unless-stopped

  dbwebapp:
    image: neumayer/dbwebapp
    env_file: dbwebapp.env
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      mysql-router:
        condition: service_started
    restart: unless-stopped

volumes:
  mysql1_data:
  mysql2_data:
  mysql3_data:
